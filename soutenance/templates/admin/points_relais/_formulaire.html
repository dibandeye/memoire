<div class="card shadow-sm" style="max-width:720px;">
  <div class="card-header admin-card-header"><i class="fa-solid fa-location-dot"></i> {{ titre_formulaire }}</div>
  <div class="card-body p-4">
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label for="nom" class="form-label fw-semibold">Nom du point relais <span class="text-danger">*</span></label>
        <input type="text" id="nom" name="nom" value="{{ donnees.nom }}" class="form-control" maxlength="150" required placeholder="Ex : Relais Plateau">
      </div>
      <div class="mb-3">
        <label for="adresse" class="form-label fw-semibold">Adresse <span class="text-danger">*</span></label>
        <input type="text" id="adresse" name="adresse" value="{{ donnees.adresse }}" class="form-control" maxlength="255" required placeholder="Ex : 12 avenue Léopold Sédar Senghor">
      </div>
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label for="ville" class="form-label fw-semibold">Ville <span class="text-danger">*</span></label>
          <input type="text" id="ville" name="ville" value="{{ donnees.ville }}" class="form-control" maxlength="100" required placeholder="Ex : Dakar">
        </div>
        <div class="col-md-6">
          <label for="telephone" class="form-label fw-semibold">Téléphone</label>
          <input type="tel" id="telephone" name="telephone" value="{{ donnees.telephone }}" class="form-control" maxlength="20" placeholder="Ex : 77 000 00 00">
        </div>
      </div>
      <p class="small text-muted mb-4"><i class="fa-regular fa-clock"></i> Horaires fixes : Lundi-Samedi 09h00-19h00, Dimanche fermé.</p>
      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-admin"><i class="fa-solid fa-check"></i> {{ libelle_bouton }}</button>
        <a href="{{ url_annuler }}" class="btn btn-outline-secondary">Annuler</a>
      </div>
    </form>
  </div>
</div>
