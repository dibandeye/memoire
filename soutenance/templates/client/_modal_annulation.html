<div class="modal fade" id="modalAnnuler{{ livraison.id }}" tabindex="-1">
  <div class="modal-dialog">
    <form method="post" action="{% url 'livraison:annuler_livraison' livraison.id %}">
      {% csrf_token %}
      <div class="modal-content" style="border:none; border-radius:16px;">
        <div class="modal-header border-0 pb-0">
          <div>
            <h5 class="modal-title text-danger fw-bold mb-1">Annuler la livraison #{{ livraison.id }}</h5>
            <div class="text-muted small">Êtes-vous sûr ? Cette action est irréversible.</div>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pt-2">
          <label class="form-label small fw-semibold text-muted">Motif d'annulation (optionnel)</label>
          <textarea name="motif_annulation" class="form-control" rows="2" placeholder="Dites-nous pourquoi (optionnel)"></textarea>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Retour</button>
          <button type="submit" class="btn btn-danger-cli"><i class="fa-solid fa-xmark"></i> Confirmer l'annulation</button>
        </div>
      </div>
    </form>
  </div>
</div>
